<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Lab Pro</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <style>
        :root { --primary: #00b3ff; --bg: #f4f7f9; --highlight: #e0f4ff; --dark: #1e293b; --topbar-h: 60px; --ui-h: 38px; }
        
        html, body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); height: 100vh; width: 100vw; overflow: hidden; }

        /* Topbar */
        .top-nav { height: var(--topbar-h); background: var(--dark); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; position: fixed; top: 0; width: 100%; z-index: 1001; box-sizing: border-box; }
        .nav-left { display: flex; align-items: baseline; gap: 10px; overflow: hidden; flex: 1; }
        .nav-left h1 { margin: 0; font-size: 1rem; font-weight: 300; white-space: nowrap; }
        .nav-left h1 b { color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        
        /* Controlli Unificati */
        .btn-main, .btn-icon, .spinner-control, .custom-select { height: var(--ui-h); display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .btn-icon { background: #334155; color: white; border: 1px solid #475569; padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        
        .spinner-control { background: #334155; border-radius: 6px; border: 1px solid #475569; overflow: hidden; }
        .spinner-control button { background: #475569; color: white; border: none; width: 32px; height: 100%; cursor: pointer; font-size: 1.1rem; }
        .spinner-control input { width: 35px; border: none; background: transparent; color: white; text-align: center; font-weight: bold; font-size: 0.85rem; -moz-appearance: textfield; }
        .spinner-control input::-webkit-outer-spin-button, .spinner-control input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .custom-select { background: #334155; color: white; border: 1px solid #475569; border-radius: 6px; padding: 0 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; outline: none; appearance: none; }

        #globalResetBtn { display: none; background: #ef4444; color: white; border: none; width: var(--ui-h); }
        .hamburger { display: block; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px; }

        /* Layout Dinamico */
        .main-layout { display: flex; flex-direction: column; gap: 10px; padding: 10px; margin-top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); box-sizing: border-box; }
        .video-column { width: 100%; flex-shrink: 0; }
        .video-wrapper { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        /* Container Tabella */
        .table-column { background: white; border-radius: 12px; padding: 10px; flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .table-container-scroll { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        /* Configurazione Desktop */
        @media (min-width: 992px) {
            .hamburger { display: none !important; }
            .nav-menu { display: flex !important; flex-direction: row; gap: 6px; }
            .main-layout { flex-direction: row-reverse; padding: 20px; gap: 20px; }
            .video-column { flex: 2; }
            .table-column { flex: 0 0 450px; }
        }

        /* Configurazione Mobile */
        @media (max-width: 991px) {
            .nav-menu { display: none; position: absolute; top: var(--topbar-h); right: 0; background: var(--dark); flex-direction: column; width: 180px; padding: 15px; box-shadow: -5px 5px 15px rgba(0,0,0,0.3); border-radius: 0 0 0 12px; gap: 12px; }
            .nav-menu.open { display: flex !important; }
            .nav-menu .btn-icon, .nav-menu .spinner-control, .nav-menu .custom-select { width: 100%; justify-content: space-between; }
        }

        /* Landscape Mobile */
        @media (max-width: 991px) and (orientation: landscape) {
            :root { --topbar-h: 50px; --ui-h: 32px; }
            .main-layout { flex-direction: row; padding: 5px; }
            .video-column { flex: 1.2; }
            .table-column { flex: 1; }
        }

        /* Fix per DataTables Scroll */
        .dataTables_wrapper { height: 100%; display: flex; flex-direction: column; }
        .dataTables_scroll { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .dataTables_scrollBody { flex: 1 !important; -webkit-overflow-scrolling: touch !important; }
        
        table.dataTable tbody td { padding: 12px 8px !important; white-space: nowrap; font-size: 0.85rem; border-bottom: 1px solid #f1f5f9 !important; }
        table.dataTable tbody tr.active-row td { background-color: var(--highlight) !important; color: var(--primary); font-weight: bold; border-left: 4px solid var(--primary); }
        .dataTables_filter, .dataTables_info, .dataTables_paginate { display: none !important; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; border-radius: 12px; width: 85%; max-width: 400px; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-left">
            <h1 id="main-title">VIDEO<b>LAB</b></h1>
            <span id="event-date" style="opacity: 0.6; font-size: 0.75rem; white-space: nowrap; margin-left: 10px; border-left: 1px solid #475569; padding-left: 10px;"></span>
        </div>

        <div class="nav-right">
            <button id="globalResetBtn" class="btn-icon" onclick="resetAll()">🧹</button>
            <button class="btn-icon" onclick="smartSkip(-5)">−5s</button>
            <button id="playBtn" class="btn-main">▶ PLAY</button>
            <button class="btn-icon" onclick="smartSkip(5)">+5s</button>
            <button class="hamburger" onclick="toggleMobileMenu(event)">☰</button>

            <div class="nav-menu" id="navMenu">
                <div class="spinner-control">
                    <button onclick="changeOffset(-1)">−</button>
                    <input type="number" id="offsetSeconds" value="0" readonly>
                    <button onclick="changeOffset(1)">+</button>
                </div>
                <select id="speedSelect" class="custom-select" onchange="player.speed = parseFloat(this.value)">
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
                <button class="btn-icon" onclick="toggleModal('filterModal', true); $('#navMenu').removeClass('open');">🔍</button>
                <button id="detailsBtn" class="btn-icon" style="opacity: 0.2; pointer-events: none;" onclick="showRowDetails()">📄</button>
            </div>
        </div>
    </nav>

    <div class="main-layout">
        <div class="video-column">
            <div class="video-wrapper">
                <div id="player-container"><div id="player" data-plyr-provider="youtube" data-plyr-embed-id=""></div></div>
            </div>
        </div>
        <div class="table-column">
            <div class="table-container-scroll">
                <table id="videoTable" class="display nowrap" style="width:100%">
                    <thead><tr><th>#</th><th>Evento</th><th>Player</th><th>Team</th><th>Per</th></tr></thead>
                    <tbody id="video-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="filterModal" class="modal"><div class="modal-content"><h3>Filtri</h3><div id="filter-container"></div><div style="text-align:right; margin-top:20px;"><button class="btn-icon" style="background:#ef4444; border:none;" onclick="resetFilters()">Reset</button><button class="btn-main" style="display:inline-block; margin-left:5px;" onclick="applyFilters()">Applica</button></div></div></div>
    <div id="detailsModal" class="modal"><div class="modal-content"><div style="display:flex; justify-content:space-between;"><h3>Dettagli</h3><button onclick="toggleModal('detailsModal', false)" style="border:none; background:none; font-size:1.5rem;">&times;</button></div><div id="details-container"></div></div></div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
